name: cla-transformers
channels:
  # conda config --set channel_priority flexible
  # the environment has to be created with an active gpu
  - pytorch
  - conda-forge
  - nvidia
  - defaults
dependencies:
  - python==3.11
  - gcc_linux-64
  - gxx_linux-64
  - cuda-nvcc
  - cuda-toolkit
  - conda-forge::pytorch
  - flash-attn-layer-norm==2.7.2
  - pip<=25.2
  - pip:
    - packaging
    - psutil
    - ninja
    - snakemake==9.15.0
    - langcodes==3.5.0
    - transformers==5.0.0rc0
    - mistral-common>=1.8.6
    - datasets==4.3.0
    - accelerate==1.11.0
    - numpy==2.4.1
    - scipy==1.17.0
    - faiss-cpu==1.13.0
