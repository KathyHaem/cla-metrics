[project]
name = "cla-metrics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets",
    "faiss-cpu",
    "langcodes",
    "matplotlib",
    "numpy",
    "scipy",
    "seqeval",
    "torch==2.11.0",
    "tqdm",
    "transformers",
    "vllm==0.25.1",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu129"
priority = "supplemental"
